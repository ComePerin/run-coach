[project]
name = "coros-coach"
version = "0.1.0"
description = "COROS MCP helpers, workout builder and adaptive endurance coach for AI agents"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "fitdecode>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
